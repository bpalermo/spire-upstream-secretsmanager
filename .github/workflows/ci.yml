name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not tags; the version each SHA
# corresponds to is in the comment beside it. Dependabot keeps them current.
#
# Caches: every job RESTORES the Bazel caches, but only runs on main SAVE them
# (cache-save below), so only reviewed code populates a cache that a later
# trusted build consumes. Gated on the ref rather than the event, because
# workflow_dispatch can target any branch.
#
# One workflow for the three components of this repository: the plugin
# (//upstream-secretsmanager), the rotator Lambda (//rotator) and the secret
# format (//intermediateca), which are built, tested and released together.
#
# Target determination: `diff` computes, with bazel-diff, the targets this
# change impacts (bazel/ci-impacted-targets.sh) and hands `build` the lists to
# build and test from; `build` is skipped when nothing is impacted. The checks
# that cover the whole tree cheaply (the formatter, Gazelle, buf breaking)
# run every time, in `lint`; buf lint is an ordinary test, run when its proto
# is impacted. Anything bazel-diff cannot decide (no base, an error) is a full run.
jobs:
  # The whole-tree checks that cost no build of consequence: the formatter,
  # the BUILD files' freshness and buf breaking. Unconditional, so a change
  # bazel-diff scopes down to nothing is still formatted, generated and
  # compatible.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: the protos are compared with the commit this
          # one is based on.
          fetch-depth: 0
          persist-credentials: false

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Starlark (with buildifier's lint warnings), Go, shell and protos. The
      # loop is there because a language whose formatter did not run reports
      # nothing, which looks the same as clean.
      - name: Everything is formatted
        run: |
          out="$(bazel run --config=ci //:format.check 2>&1)" || { echo "${out}"; echo "::error::run 'bazel run //:format'" >&2; exit 1; }
          echo "${out}"
          for language in Starlark Go Shell "Protocol Buffer"; do
            if ! grep -q "^Formatted ${language} " <<<"${out}"; then
              echo "::error::the formatter did not run for ${language}" >&2
              exit 1
            fi
          done

      # Gazelle generates the BUILD files, so a hand-edited or stale one is a
      # real failure mode: the build keeps working against the old graph until
      # someone regenerates and the diff appears in an unrelated PR.
      - name: BUILD files are up to date
        run: |
          bazel run --config=ci //:gazelle
          if ! git diff --exit-code -- 'BUILD.bazel' '**/BUILD.bazel'; then
            echo "::error::BUILD files are stale; run 'bazel run //:gazelle'" >&2
            exit 1
          fi

      # A field renumbered, retyped, renamed or removed in the secret format or
      # a configuration (buf.yaml's breaking rules). A pull request is
      # compared with the commit it branched from; a push to main with the
      # commit before it, since merges are squashed.
      - name: The protos keep their compatibility
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            against="origin/${BASE_REF}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            against="HEAD^"
          else
            against="origin/main"
          fi
          bazel/proto/breaking.sh "${against}" --config=ci

  # Target determination. bazel-diff hashes the build graph at the base and at
  # the head of the range under test and reports the targets whose hash
  # changed; bazel/ci-impacted-targets.sh splits them into what to build and
  # what to test, and uploads the lists for `build`.
  # On any error, or without a base (workflow_dispatch), it falls back to a
  # full run; it never reports an empty set on a failure.
  #
  # The range: on pull_request the checkout is the merge of the pull request
  # into its base, so the base is the merge's first parent and the head the
  # merge itself, the tree every job builds. On push to main the parent of the
  # squash-merged commit is what main was before it. workflow_dispatch has no
  # base, and runs everything.
  diff:
    name: diff
    runs-on: ubuntu-latest
    outputs:
      has_any: ${{ steps.impacted.outputs.has_any }}
      has_test: ${{ steps.impacted.outputs.has_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: the base has to be reachable for the diff.
          fetch-depth: 0
          persist-credentials: false

      - name: the range under test
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=""
          case "${EVENT}" in
            pull_request)
              if [ "$(git rev-parse HEAD^2 2>/dev/null)" = "${PR_HEAD}" ]; then
                base="$(git rev-parse HEAD^1)"
              else
                echo "::warning::the checkout is not the merge of ${PR_HEAD}; no base, running everything" >&2
              fi
              ;;
            push)
              base="$(git rev-parse HEAD^1 2>/dev/null)" || base=""
              ;;
          esac
          echo "base=${base}" >>"${GITHUB_OUTPUT}"
          echo "head=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          echo "range: ${base:-<none: full run>} .. $(git rev-parse HEAD)"

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # bazel-diff, the statically linked binary of its GitHub release, pinned
      # by version and checksum (the digest GitHub records for the asset).
      # Releases after v47.0.0 ship no bazel-diff_deploy.jar any more, so no
      # Java is needed.
      - name: bazel-diff
        env:
          VERSION: v60.0.0
          SHA256: 4c1e70c955a7a950fc0ce15d921e976078a5fd1571e423c05016cb6e7c433dac
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/bazel-diff" \
            "https://github.com/Tinder/bazel-diff/releases/download/${VERSION}/bazel-diff-rust-linux-amd64"
          echo "${SHA256}  ${RUNNER_TEMP}/bazel-diff" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bazel-diff"

      # From a copy outside the tree: the script checks the base and the head
      # out in turn, which would otherwise swap the script file mid-run.
      - name: bazel/ci-impacted-targets.sh
        id: impacted
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          BAZEL_DIFF: ${{ runner.temp }}/bazel-diff
          OUT_DIR: ${{ runner.temp }}/bazel-diff-out
        run: |
          cp bazel/ci-impacted-targets.sh "${RUNNER_TEMP}/ci-impacted-targets.sh"
          bash "${RUNNER_TEMP}/ci-impacted-targets.sh"

      - name: upload the impacted target lists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/bazel-diff-out/impacted_*.txt
          if-no-files-found: error

  # Builds every impacted target and runs the impacted tests. Skipped when
  # nothing is impacted; the aggregate below accepts that only when `diff`
  # said so.
  build:
    name: build
    needs: [diff]
    if: needs.diff.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: download the impacted target lists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted

      # --config=ci refuses lockfile drift, and runs shellcheck on every
      # script as part of the build (bazel/lint/linters.bzl). The Go analyzers
      # of //:nogo run as part of compiling, so a finding fails here.
      - name: bazel build the impacted targets
        run: bazel build --config=ci --target_pattern_file="${RUNNER_TEMP}/impacted/impacted_build.txt"

      - name: bazel test the impacted tests
        if: needs.diff.outputs.has_test == 'true'
        run: bazel test --config=ci --target_pattern_file="${RUNNER_TEMP}/impacted/impacted_test.txt"

  # The single check a ruleset should require. A required status check is
  # matched by check-run name, so requiring the jobs themselves ties the
  # ruleset to their names; requiring one aggregate leaves the jobs free to
  # change. if: always() so it runs even when a job fails; a skipped job
  # reports nothing, and a required check that never reports blocks the pull
  # request.
  #
  # A job bazel-diff scoped out is `skipped`, and that passes only where
  # `diff` said so, in so many words: `build` skipped with has_any `false`.
  # An output that was never set reads as the empty string, skips the job
  # exactly as `false` does, and is refused here. Everything else has to be
  # `success`.
  ci:
    name: ci
    needs: [lint, diff, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job ended the way diff's outputs say it must
        env:
          LINT: ${{ needs.lint.result }}
          DIFF: ${{ needs.diff.result }}
          BUILD: ${{ needs.build.result }}
          HAS_ANY: ${{ needs.diff.outputs.has_any }}
        run: |
          echo "lint=${LINT} diff=${DIFF} build=${BUILD} has_any='${HAS_ANY}'"
          ok=1
          [ "${LINT}" = success ] || { echo "::error::lint reported '${LINT}'" >&2; ok=0; }
          [ "${DIFF}" = success ] || { echo "::error::diff reported '${DIFF}'" >&2; ok=0; }
          case "${BUILD}:${HAS_ANY}" in
            success:true | skipped:false) ;;
            *) echo "::error::build reported '${BUILD}' with has_any '${HAS_ANY}'" >&2; ok=0 ;;
          esac
          [ "${ok}" = 1 ]
