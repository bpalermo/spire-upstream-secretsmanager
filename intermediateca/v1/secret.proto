// The secret format of an intermediate CA kept in a secret store.
//
// A writer (a rotator) stores one Secret as JSON, and a reader (a consumer
// such as a certificate authority plugin) loads it. The JSON is the protobuf
// JSON mapping of this message, and its field names are the single-word names
// below, so they are the same in every mapping. docs/secret-format.md is the
// specification; this file is its machine-readable schema.
syntax = "proto3";

package intermediateca.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/bpalermo/spire-upstream-secretsmanager/intermediateca/v1;intermediatecav1";

// Secret is an intermediate CA: its certificate, its private key and the
// certificates that lead from it to a trust anchor.
message Secret {
  // format identifies the version of this format. It is always
  // "intermediate-ca/v1"; a reader refuses any other value rather than guess.
  string format = 1 [(buf.validate.field) = {
    required: true
    string: {const: "intermediate-ca/v1"}
  }];

  // cert is the intermediate CA's certificate: exactly one PEM
  // "CERTIFICATE" block.
  string cert = 2 [(buf.validate.field) = {
    required: true
    string: {
      prefix: "-----BEGIN CERTIFICATE-----"
      max_bytes: 16384
    }
  }];

  // key is the private key of cert: exactly one PEM "PRIVATE KEY" block, a
  // PKCS#8 PrivateKeyInfo.
  string key = 3 [(buf.validate.field) = {
    required: true
    string: {
      prefix: "-----BEGIN PRIVATE KEY-----"
      max_bytes: 16384
    }
  }];

  // chain holds the certificates between cert and root, in any order, as PEM
  // "CERTIFICATE" blocks. It is empty when cert is issued by root directly.
  string chain = 4 [(buf.validate.field) = {
    string: {max_bytes: 65536}
    cel: {
      id: "chain.pem"
      message: "chain must be empty or start with a PEM certificate"
      expression: "this == '' || this.startsWith('-----BEGIN CERTIFICATE-----')"
    }
  }];

  // root is the trust anchor that cert chains up to: exactly one PEM
  // "CERTIFICATE" block.
  string root = 5 [(buf.validate.field) = {
    required: true
    string: {
      prefix: "-----BEGIN CERTIFICATE-----"
      max_bytes: 16384
    }
  }];
}
