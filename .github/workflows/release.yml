name: release

# A tag v<VERSION> or v<VERSION>-rc.<n> on a commit of main publishes that
# release: the plugin binaries, their checksums, an SBOM, the multi-arch image,
# the cosign keyless signatures, and the GitHub Release that lists them. Who may
# create such a tag, and that it can never be moved or deleted, is the
# repository's tag rulesets'.
on:
  push:
    tags: ["v*"]

# The least each job needs; `publish` adds the OIDC token it signs with and
# the right to write the image's package, `release` the write that creates the
# GitHub Release.
permissions:
  contents: read

# Keyed by tag, so a release is never published twice at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep equal to the platforms of //cmd/upstream-secretsmanager (the
  # upstream-secretsmanager_<platform> targets) and the query in ci.yml.
  RELEASE_PLATFORMS: linux_amd64 linux_arm64

# Third-party actions are pinned to commit SHAs, not tags. This job holds
# `packages: write` and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. The version each SHA corresponds to is in
# the comment beside it.
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushes the image to ghcr.io/<owner>/<repository>.
      packages: write
      # Exchanged with Fulcio for a short-lived signing certificate. Keyless:
      # there is no private key to store or rotate.
      id-token: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The version comes from the tags (bazel/workspace_status.sh), and a
          # release tag is checked against main's history: both need all of it.
          fetch-depth: 0
          # Nothing after this step talks to git over the network, and the job
          # then runs Bazel, which executes build tooling from the dependency
          # graph: no reason to leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      # A release is something main has been, never a side branch. ls-remote
      # rather than the API: this repository is public, so the check needs no
      # token.
      - name: Refuse to release a commit main has not been
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "${tip}"; then
            echo "::error::refusing to release ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not a commit of main" >&2
            exit 1
          fi
          echo "releasing ${GITHUB_REF_NAME} from ${GITHUB_SHA}, a commit of main"

      # Scanned before Bazel runs, so that the scan sees the checkout and not
      # Bazel's output tree.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The image is tagged with the release (vX.Y.Z and vX.Y.Z-<commit>)
      # instead of `dev`. The flag goes into user.bazelrc under --config=ci, so
      # that every build, run and cquery below sees one configuration.
      - name: Tag the image with the release
        run: echo "common:ci --//cmd/upstream-secretsmanager:image_tag=${GITHUB_REF_NAME}" >> user.bazelrc

      # No version is pinned here: bazelisk reads .bazelversion.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: false

      # Everything is built before any credential exists on the runner: Bazel
      # executes build tooling from the dependency graph, and a registry
      # credential sitting in ~/.docker/config.json while that runs is
      # readable by all of it. The `bazel run` steps below then only execute
      # what this step already produced.
      #
      # --output_groups=+digest: see the digest file the image index writes.
      #
      # Keep this list equal to the query in ci.yml, which fails a pull request
      # that renames or removes one of these.
      - name: Build the binaries, the image and cosign
        run: |
          set -euo pipefail
          targets=()
          for platform in ${RELEASE_PLATFORMS}; do
            targets+=("//cmd/upstream-secretsmanager:upstream-secretsmanager_${platform}")
          done
          bazel build --config=ci --output_groups=+digest "${targets[@]}" \
            //cmd/upstream-secretsmanager:image_push //cmd/upstream-secretsmanager:image_index \
            //bazel/cosign

      # Named upstream-secretsmanager_<version>_<os>_<arch>, the version
      # without its v, beside checksums.txt in sha256sum's format. SPIRE's
      # plugin_checksum is the SHA-256 of the binary, so each line of
      # checksums.txt is the value for that architecture. All come from one
      # stamped build, so they carry one version; the linux/amd64 one, which
      # this runner can run, must report the tag, or nothing is signed.
      - name: Collect the binaries and their checksums
        run: |
          set -euo pipefail
          status="$(bazel/workspace_status.sh)"
          release="$(sed -n 's/^STABLE_RELEASE_TAG //p' <<<"${status}")"
          if [ "${release}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::${GITHUB_REF_NAME} is not a release of VERSION $(cat VERSION) (the workspace status says '${release}')" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          rm -rf dist
          mkdir dist
          for platform in ${RELEASE_PLATFORMS}; do
            built="$(bazel cquery --config=ci "//cmd/upstream-secretsmanager:upstream-secretsmanager_${platform}" --output=files 2>/dev/null | head -1)"
            if [ -z "${built}" ] || [ ! -s "${built}" ]; then
              echo "::error::could not find the binary of ${platform} (${built})" >&2
              exit 1
            fi
            install -m 0755 "${built}" "dist/upstream-secretsmanager_${version}_${platform}"
          done
          got="$("dist/upstream-secretsmanager_${version}_linux_amd64" --version)"
          if [ "${got}" != "upstream-secretsmanager ${GITHUB_REF_NAME}" ]; then
            echo "::error::the binary reports '${got}', want 'upstream-secretsmanager ${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          cp "${RUNNER_TEMP}/sbom.spdx.json" "dist/upstream-secretsmanager_${version}_sbom.spdx.json"
          (cd dist && sha256sum upstream-secretsmanager_*_linux_* >checksums.txt)
          cat dist/checksums.txt

      # cosign 3 writes the signature, its certificate and the transparency
      # log entry into one Sigstore bundle. `bazel run` passes the OIDC
      # request variables through to cosign.
      - name: Sign checksums.txt and the SBOM
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for f in checksums.txt "upstream-secretsmanager_${version}_sbom.spdx.json"; do
            bazel run --config=ci //bazel/cosign -- sign-blob --bundle "dist/${f}.sigstore.json" "dist/${f}"
          done

      - name: Verify the signatures and the checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for f in checksums.txt "upstream-secretsmanager_${version}_sbom.spdx.json"; do
            bazel run --config=ci //bazel/cosign -- verify-blob "dist/${f}" \
              --bundle "dist/${f}.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          (cd dist && sha256sum -c checksums.txt)

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the multi-arch image
        run: bazel run --config=ci //cmd/upstream-secretsmanager:image_push

      # The digest comes from the build rather than from the registry: Bazel
      # already wrote the digest and the coordinates it pushed (image_push.json
      # sits beside the index, in the same package of bazel-bin).
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          push="$(bazel info --config=ci bazel-bin 2>/dev/null)/cmd/upstream-secretsmanager/image_push.json"
          ref="$(jq -er '.operations[0] | .registry + "/" + .repository + "@" + .root.digest' "${push}")"
          if ! [[ "${ref}" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image reference ${ref}" >&2
            exit 1
          fi
          echo "image=${ref}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${ref}"

      # --recursive signs the index and every child manifest. Without it,
      # anyone pulling the amd64 or arm64 manifest by its own digest gets
      # something unsigned. Signing by digest rather than by tag avoids cosign
      # re-resolving a mutable tag to something other than what was pushed.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.digest.outputs.image }}
        run: bazel run --config=ci //bazel/cosign -- sign --recursive "${IMAGE}"

      # With no credential of ours: the image is public, and this is the check
      # a consumer can run.
      - name: Verify the image signature
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          bazel run --config=ci //bazel/cosign -- verify "${IMAGE}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The GitHub Release of the tag: what was published, by digest, the checksum
  # of each architecture's binary for SPIRE's plugin_checksum, and how to
  # verify it, then the changes since the last release. A job of its own, so
  # that the publishing job, which can write the package and sign, never also
  # holds a token that can write to the repository.
  release:
    name: release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # Exactly the files `publish` signed and verified, unchanged on the way:
      # a release with a file missing, or one more, is refused.
      - name: Check the release files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          want="$(printf '%s\n' checksums.txt checksums.txt.sigstore.json \
            "upstream-secretsmanager_${version}_linux_amd64" "upstream-secretsmanager_${version}_linux_arm64" \
            "upstream-secretsmanager_${version}_sbom.spdx.json" "upstream-secretsmanager_${version}_sbom.spdx.json.sigstore.json" | sort)"
          got="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::the release artifact holds:" >&2
            echo "${got}" >&2
            exit 1
          fi
          (cd dist && sha256sum -c checksums.txt)

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=()
          if [[ "${tag}" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi
          # The changes since the last release, not since the last candidate.
          # The first release has none before it, and lists everything.
          previous="$(git tag --list 'v*' --sort=-version:refname --merged "${GITHUB_SHA}" |
            grep -Ev -- '-rc\.' | grep -vx "${tag}" | head -1 || true)"
          args=(-f "tag_name=${tag}")
          if [ -n "${previous}" ]; then
            args+=(-f "previous_tag_name=${previous}")
          fi
          changes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body)"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          amd64="$(awk -v f="upstream-secretsmanager_${version}_linux_amd64" '$2 == f {print $1}' dist/checksums.txt)"
          arm64="$(awk -v f="upstream-secretsmanager_${version}_linux_arm64" '$2 == f {print $1}' dist/checksums.txt)"
          if [ -z "${amd64}" ] || [ -z "${arm64}" ]; then
            echo "::error::checksums.txt has no checksum for one of the architectures" >&2
            exit 1
          fi
          cat >notes.md <<NOTES
          ## Plugin checksums

          SPIRE's \`plugin_checksum\` is the SHA-256 of the plugin binary. Use the
          one of the architecture the SPIRE server runs on:

          | Architecture | Binary | \`plugin_checksum\` |
          |---|---|---|
          | linux/amd64 | \`upstream-secretsmanager_${version}_linux_amd64\` | \`${amd64}\` |
          | linux/arm64 | \`upstream-secretsmanager_${version}_linux_arm64\` | \`${arm64}\` |

          The binaries are statically linked and stamped with \`${tag}\`
          (\`--version\`).

          ## Image

          \`${IMAGE}\`

          Multi-arch (linux/amd64, linux/arm64). It holds the binary at
          \`/upstream-secretsmanager\` (mode 0755) and nothing else: no base image,
          no shell, no libc. It is meant to be mounted into the SPIRE server pod
          as a Kubernetes image volume and executed from there. Also tagged
          \`${tag}\`.

          ## Verify

          The image, its platform manifests, \`checksums.txt\` and the SBOM are
          signed by this release's workflow run:

          \`\`\`bash
          cosign verify ${IMAGE} \\
            --certificate-identity '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
            --certificate-identity '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --ignore-missing -c checksums.txt
          \`\`\`

          ${changes}
          NOTES
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${tag}" --notes-file notes.md "${prerelease[@]}" \
            dist/*
