name: release

# A tag v<VERSION> or v<VERSION>-rc.<n> on a commit of main publishes that
# release of the plugin and the rotator, under the one version: the plugin
# binaries, the plugin's multi-arch image, the rotator Lambda's zip archives,
# an SPDX SBOM of each binary and archive, checksums.txt over all of them,
# the cosign keyless signatures, and the GitHub Release that lists them. Who
# may create such a tag, and that it can never be moved or deleted, is the
# repository's tag rulesets'.
on:
  push:
    tags: ["v*"]

# The least each job needs; `publish` adds the OIDC token it signs with,
# `release` the write that creates the GitHub Release.
permissions:
  contents: read

# Keyed by tag, so a release is never published twice at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep equal to the platforms of //upstream-secretsmanager (the
  # upstream-secretsmanager_<platform> targets) and of //rotator (the
  # zip_<platform> targets).
  RELEASE_PLATFORMS: linux_amd64 linux_arm64
  # syft writes the SBOMs, from the Go build information in each binary. The
  # release archive is checked against this SHA-256, from syft's own
  # syft_<version>_checksums.txt.
  SYFT_VERSION: 1.54.1
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
  SYFT_CHECK_FOR_APP_UPDATE: "false"

# Credentials are a Quay robot account, secrets QUAY_USERNAME / QUAY_TOKEN of
# the `release` environment. The robot can write the repository and cannot
# create it: it must exist already.
#
# Third-party actions are pinned to commit SHAs, not tags. This job holds the
# registry credential and `id-token: write`, so an action that a retagged or
# compromised release swapped underneath us could push and sign an image with
# this repository's own identity. A tag is mutable; a commit SHA is not. The
# version each SHA corresponds to is in the comment beside it.
jobs:
  publish:
    name: publish
    # Only a release tag signs. The trigger is v* tags alone; the guard keeps
    # it that way if a trigger is ever added.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged with Fulcio for a short-lived signing certificate. Keyless:
      # there is no private key to store or rotate. It is a job permission,
      # so every step of this job, Bazel and its build tooling included, can
      # request an OIDC token for this workflow's identity.
      id-token: write
    env:
      # Where //upstream-secretsmanager:image_push pushes (bazel/registry.bzl).
      IMAGE: quay.io/palermo/spire-upstream-secretsmanager
      # The certificate identity of a release signature: this workflow, run
      # for a release tag.
      SIGNER: '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
      ISSUER: https://token.actions.githubusercontent.com
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The version comes from the tags (bazel/workspace_status.sh), and a
          # release tag is checked against main's history: both need all of it.
          fetch-depth: 0
          # Nothing after this step talks to git over the network, and the job
          # then runs Bazel, which executes build tooling from the dependency
          # graph: no reason to leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      # A release is something main has been, never a side branch. ls-remote
      # rather than the API: this repository is public, so the check needs no
      # token.
      - name: Refuse to release a commit main has not been
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "${tip}"; then
            echo "::error::refusing to release ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not a commit of main" >&2
            exit 1
          fi
          echo "releasing ${GITHUB_REF_NAME} from ${GITHUB_SHA}, a commit of main"

      # The image is tagged with the release (vX.Y.Z and vX.Y.Z-<commit>)
      # instead of `dev`. The flag goes into user.bazelrc under --config=ci, so
      # that every build, run and cquery below sees one configuration.
      - name: Tag the image with the release
        run: echo "common:ci --//upstream-secretsmanager:image_tag=${GITHUB_REF_NAME}" >> user.bazelrc

      # No version is pinned here: bazelisk reads .bazelversion.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # Built before the registry login, so the Quay credential is not in
      # ~/.docker/config.json while Bazel runs build tooling. The OIDC token
      # is another matter: `id-token: write` makes it available to every
      # step of this job, this one included.
      #
      # --output_groups=+digest: see the digest file the image index writes.
      - name: Build the binaries, the archives, the image and cosign
        run: |
          set -euo pipefail
          targets=()
          for platform in ${RELEASE_PLATFORMS}; do
            targets+=("//upstream-secretsmanager:upstream-secretsmanager_${platform}" "//rotator:zip_${platform}")
          done
          bazel build --config=ci --output_groups=+digest "${targets[@]}" \
            //upstream-secretsmanager:image_push //upstream-secretsmanager:image_index \
            //bazel/cosign

      # A pinned, checksummed release binary rather than an action, for the
      # reason the actions are pinned: this job can sign.
      - name: Install syft
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "${GITHUB_PATH}"

      # The plugin binaries are named upstream-secretsmanager_<version>_<os>_<arch>
      # and the Lambda archives kms-intermediate-rotator_<version>_linux_<arch>.zip,
      # the version without its v, beside checksums.txt in sha256sum's format.
      # SPIRE's plugin_checksum is the SHA-256 of the binary, so each plugin
      # line of checksums.txt is the value for that architecture. Each binary
      # and archive has an SPDX SBOM beside it, <file>.spdx.json, which
      # checksums.txt covers too. All come
      # from one stamped build; the linux/amd64 plugin, which this runner can
      # run, must report the tag, or nothing is signed.
      - name: Collect the binaries, the archives, their SBOMs and their checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          rm -rf dist
          mkdir dist
          # built <label>: the file the label built, or fail.
          built() {
            local f
            f="$(bazel cquery --config=ci "$1" --output=files 2>/dev/null | head -1)"
            if [ -z "${f}" ] || [ ! -s "${f}" ]; then
              echo "::error::could not find what $1 built (${f})" >&2
              exit 1
            fi
            echo "${f}"
          }
          for platform in ${RELEASE_PLATFORMS}; do
            install -m 0755 "$(built "//upstream-secretsmanager:upstream-secretsmanager_${platform}")" \
              "dist/upstream-secretsmanager_${version}_${platform}"
            install -m 0644 "$(built "//rotator:zip_${platform}")" \
              "dist/kms-intermediate-rotator_${version}_${platform}.zip"
          done
          got="$("dist/upstream-secretsmanager_${version}_linux_amd64" --version)"
          if [ "${got}" != "upstream-secretsmanager ${GITHUB_REF_NAME}" ]; then
            echo "::error::the plugin reports '${got}', want 'upstream-secretsmanager ${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          for f in dist/upstream-secretsmanager_* dist/kms-intermediate-rotator_*; do
            syft scan "file:${f}" --quiet --source-version "${version}" -o "spdx-json=${f}.spdx.json"
          done
          (cd dist && sha256sum upstream-secretsmanager_* kms-intermediate-rotator_* >checksums.txt)
          cat dist/checksums.txt

      # cosign 3 writes the signature, its certificate and the transparency
      # log entry into one Sigstore bundle. `bazel run` passes the OIDC
      # request variables through to cosign.
      - name: Sign checksums.txt
        env:
          COSIGN_YES: "true"
        run: bazel run --config=ci //bazel/cosign -- sign-blob --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Verify checksums.txt
        run: |
          set -euo pipefail
          bazel run --config=ci //bazel/cosign -- verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp "${SIGNER}" --certificate-oidc-issuer "${ISSUER}"
          (cd dist && sha256sum -c checksums.txt)

      # The login writes ~/.docker/config.json, which image_push (rules_img)
      # and cosign read: only the push and the signing need it.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push the multi-arch image
        run: bazel run --config=ci //upstream-secretsmanager:image_push

      # The digest comes from the build rather than from the registry: Bazel
      # already wrote the digest and the coordinates it pushed (image_push.json
      # sits beside the index, in upstream-secretsmanager/ of bazel-bin).
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          push="$(bazel info --config=ci bazel-bin 2>/dev/null)/upstream-secretsmanager/image_push.json"
          ref="$(jq -er '.operations[0] | .registry + "/" + .repository + "@" + .root.digest' "${push}")"
          if ! [[ "${ref}" =~ ^${IMAGE}@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::pushed ${ref}, which is not ${IMAGE}@sha256:<digest>" >&2
            exit 1
          fi
          echo "image=${ref}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${ref}"

      # --recursive signs the index and every child manifest, so a platform
      # manifest pulled by its own digest is signed too. By digest, not by
      # tag, so cosign cannot re-resolve a tag to something else.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
          REF: ${{ steps.digest.outputs.image }}
        run: bazel run --config=ci //bazel/cosign -- sign --recursive "${REF}"

      # As anyone would verify it: anonymously (the repository is public),
      # not with the robot's credential the login left behind.
      - name: Verify the image
        env:
          REF: ${{ steps.digest.outputs.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          bazel run --config=ci //bazel/cosign -- verify "${REF}" \
            --certificate-identity-regexp "${SIGNER}" --certificate-oidc-issuer "${ISSUER}" >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The GitHub Release of the tag: what was published, by digest, the checksum
  # of each architecture's plugin binary for SPIRE's plugin_checksum, the
  # SHA-256 of each Lambda archive, and how to verify them, then the changes
  # since the last release. A job of its own, so
  # that the publishing job, which can write the package and sign, never also
  # holds a token that can write to the repository.
  release:
    name: release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # Exactly the files `publish` signed and verified, unchanged on the way:
      # a release with a file missing, or one more, is refused.
      - name: Check the release files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          files=("upstream-secretsmanager_${version}_linux_amd64" "upstream-secretsmanager_${version}_linux_arm64"
            "kms-intermediate-rotator_${version}_linux_amd64.zip" "kms-intermediate-rotator_${version}_linux_arm64.zip")
          want="$(printf '%s\n' checksums.txt checksums.txt.sigstore.json "${files[@]}" \
            "${files[@]/%/.spdx.json}" | sort)"
          got="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::the release artifact holds:" >&2
            echo "${got}" >&2
            exit 1
          fi
          (cd dist && sha256sum -c checksums.txt)

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=()
          if [[ "${tag}" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi
          # The changes since the last release, not since the last candidate.
          # The first release has none before it, and lists everything.
          previous="$(git tag --list 'v*' --sort=-version:refname --merged "${GITHUB_SHA}" |
            grep -Ev -- '-rc\.' | grep -vx "${tag}" | head -1 || true)"
          args=(-f "tag_name=${tag}")
          if [ -n "${previous}" ]; then
            args+=(-f "previous_tag_name=${previous}")
          fi
          changes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body)"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          # sum <file>: its SHA-256 from checksums.txt, or fail.
          sum() {
            local v
            v="$(awk -v f="$1" '$2 == f {print $1}' dist/checksums.txt)"
            [ -n "${v}" ] || { echo "::error::checksums.txt has no checksum for $1" >&2; exit 1; }
            echo "${v}"
          }
          amd64="$(sum "upstream-secretsmanager_${version}_linux_amd64")"
          arm64="$(sum "upstream-secretsmanager_${version}_linux_arm64")"
          zip_amd64="$(sum "kms-intermediate-rotator_${version}_linux_amd64.zip")"
          zip_arm64="$(sum "kms-intermediate-rotator_${version}_linux_arm64.zip")"
          cat >notes.md <<NOTES
          ## Plugin checksums

          SPIRE's \`plugin_checksum\` is the SHA-256 of the plugin binary. Use the
          one of the architecture the SPIRE server runs on:

          | Architecture | Binary | \`plugin_checksum\` |
          |---|---|---|
          | linux/amd64 | \`upstream-secretsmanager_${version}_linux_amd64\` | \`${amd64}\` |
          | linux/arm64 | \`upstream-secretsmanager_${version}_linux_arm64\` | \`${arm64}\` |

          The binaries are statically linked and stamped with \`${tag}\`
          (\`--version\`).

          ## Plugin image

          \`${IMAGE}\`

          Multi-arch (linux/amd64, linux/arm64). It holds the binary at
          \`/upstream-secretsmanager\` (mode 0755) and nothing else: no base image,
          no shell, no libc. It is meant to be mounted into the SPIRE server pod
          as a Kubernetes image volume and executed from there. Also tagged
          \`${tag}\`.

          ## Rotator Lambda

          For the \`provided.al2023\` custom runtime. Pick the archive of the
          function's architecture; it holds one statically linked executable,
          \`bootstrap\`. Lambda's \`source_code_hash\` is the base64 of the
          same digest.

          | Architecture | Archive | SHA-256 |
          |---|---|---|
          | arm64 | \`kms-intermediate-rotator_${version}_linux_arm64.zip\` | \`${zip_arm64}\` |
          | x86_64 | \`kms-intermediate-rotator_${version}_linux_amd64.zip\` | \`${zip_amd64}\` |

          ## Secret format

          \`intermediate-ca/v1\`, unchanged in meaning across releases
          (docs/secret-format.md).

          ## Verify

          The image, its platform manifests and \`checksums.txt\` (which lists
          the plugin binaries, the Lambda archives and the SPDX SBOM of each,
          \`<file>.spdx.json\`) are signed by this release's workflow run:

          \`\`\`bash
          cosign verify ${IMAGE} \\
            --certificate-identity '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
            --certificate-identity '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --ignore-missing -c checksums.txt
          \`\`\`

          ${changes}
          NOTES
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${tag}" --notes-file notes.md "${prerelease[@]}" \
            dist/*
